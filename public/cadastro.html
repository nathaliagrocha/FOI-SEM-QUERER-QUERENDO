<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chaves - Cadastro</title>

  <!-- Importando fontes e estilos do projeto -->
  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <!-- Ícone para a setinha de voltar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- Botão de Voltar (Setinha no topo esquerdo) -->
  <a href="index.html" class="botao-voltar" title="Voltar para a página inicial">
    <i class="fa-solid fa-arrow-left"></i>
  </a>

  <!-- Container Principal com o Fundo Fixo do Banner -->
  <div class="container-cadastro-principal">
    
    <!-- Caixa Transparente Aumentada -->
    <div class="card-cadastro-container">

      <!-- Lado Esquerdo: Formulário de Cadastro -->
      <div class="lado-formulario">
        <h2>Faça seu Cadastro</h2>
        
        <div class="formulario">
          <div class="campo">
            <span>Nome:</span>
            <input id="input_nome" type="text" placeholder="Seu nome completo" />
          </div>

          <div class="campo">
            <span>E-mail:</span>
            <input id="input_email" type="text" placeholder="meuemail@provedor.com" />
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input id="input_senha" type="password" placeholder="******" />
          </div>

          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="input_confirmacao_senha" type="password" placeholder="******" />
          </div>

          <button class="botao-cadastrar" onclick="cadastrar()">Cadastrar</button>
        </div>
      </div>

      <!-- Lado Direito: Degradê e Chapéu do Chaves -->
      <div class="lado-degrade-info">
        <div class="conteudo-direito">
          <div class="container-imagem-chapu">
            <img src="assets/chaves_chapeu.png" alt="Chapéu do Chaves" class="img-chapu-ilustracao">
          </div>
          <h3>"Isso, isso, isso!"</h3>
          <p class="frase-convite">Já tem uma conta? Acesse por aqui e volte para a vila!</p>
          <a href="login.html" class="botao-ir-login">Fazer Login</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

<script>
function cadastrar() {
    var nomeVar = input_nome.value;
    var emailVar = input_email.value;
    
    // Transforma o e-mail inteiro em letras minúsculas
    emailVar = emailVar.toLowerCase();
    input_email.value = emailVar;

    var senhaVar = input_senha.value;
    var confirmacaoSenhaVar = input_confirmacao_senha.value;

    // 1. Verificar campos em branco
    if (nomeVar == "" || emailVar == "" || senhaVar == "" || confirmacaoSenhaVar == "") {
        alert("Preencha todos os campos!");
        return false;
    }

    // 2. Validação básica de e-mail (usando indexOf)
    if (emailVar.indexOf("@") == -1 || emailVar.indexOf(".com") == -1 || emailVar.indexOf(".@") != -1 || emailVar.indexOf("@.") != -1) {
        alert("E-mail inválido! Verifique o '@', o '.com' e os pontos.");
        return false;
    }

    // 3. Validação de tamanho mínimo da senha (8 caracteres)
    if (senhaVar.length < 8) {
        alert("A senha deve ter pelo menos 8 caracteres!");
        return false;
    }

    // 4. Validação usando 'for' para garantir que tem pelo menos um número
    var temNumero = false;
    for (var i = 0; i < senhaVar.length; i++) {
        var caractere = senhaVar[i];
        if (caractere >= '0' && caractere <= '9') {
            temNumero = true;
        }
    }

    if (temNumero == false) {
        alert("A senha precisa conter pelo menos um número!");
        return false;
    }

    // 5. Confirmação de senha
    if (senhaVar != confirmacaoSenhaVar) {
        alert("A confirmação de senha está diferente da senha!");
        return false;
    }

    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar
        }),
    }).then(function (resposta) {
        if (resposta.ok) {
            alert("Cadastro realizado com sucesso!");
            location.href = "login.html"; 
        } else {
            alert("Houve um erro ao tentar realizar o cadastro!");
        }
    }).catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
    });

    return false;
}
</script>
