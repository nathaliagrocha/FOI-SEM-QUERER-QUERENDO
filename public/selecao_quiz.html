<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Chaves</title>
    <link rel="stylesheet" href="css/quiz.css">
    <!-- Carrega as funções de sessão (validarSessao, etc.) -->
    <script src="js/sessao.js"></script>
</head>


<body>
    <div class="janela">
        <!-- Navbar Lateral com Fundo de Tijolinhos -->
        <div class="header-left">
            <a href="dashboard/boas_vindas.html">
                <img src="assets/chaves_logo.png" alt="Chaves" style="width: 300px; height: auto;">
            </a>

            <div class="hello">
                <h3 style="color: #ffcc00; font-weight: 600;">Olá, <span id="b_usuario">Gerente</span></h3>
            </div>

            <div class="btn-nav">
                <a href="dashboard/dashboardCopia.html" style="color: white; text-decoration: none;">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-nav">
                <a href="selecao_quiz.html" style="color: white; text-decoration: none;">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-logout"><a href="index.html">
                <h3>Sair</h3>
                </a>
            </div>
        </div>

        <!-- ÁREA AO LADO DA NAVBAR -->
        <div class="selecao_conteudo">

            <!-- TELA 1: os três quizzes -->
            <div id="tela_selecao">
                <h2 class="selecao_titulo">Você sabe tudo sobre chaves?</h2>

                <div class="selecao_quiz_grid">
                    <div class="selecao_quiz_card">
                        <h3>Quiz Epiodios</h3>
                        <button type="button" onclick="window.location.href='quiz.html'">Realizar Quiz</button>
                    </div>

                    <div class="selecao_quiz_card">
                        <h3>Quiz Acontecimentos</h3>
                        <button type="button" onclick="window.location.href='quiz_2.html'">Realizar Quiz</button>
                    </div>

                    <div class="selecao_quiz_card">
                        <h3>Quiz Personagens</h3>
                        <button type="button" onclick="window.location.href='quiz_3.html'">Realizar Quiz</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- A validação de sessão também está embutida em cada página de quiz (quiz.html, quiz_2.html e quiz_3.html). -->
    <script>
        validarSessao();

        window.addEventListener("pageshow", function (evento) {
            if (evento.persisted) {
                validarSessao();
            }
        });
    </script>
</body>

</html>
