<!DOCTYPE html>
<html lang="pt-br">

<head>
    <link rel="shortcut icon" href="../assets/icon/favicon2.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaves | Painel Administrador</title>

    <link rel="stylesheet" href="./../css/quiz.css">
    <script src="../js/sessao.js"></script>
    <script src="../js/alerta.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;600;700&display=swap"
        rel="stylesheet">

    <!--FONT AWESOME-->
    <script src="https://kit.fontawesome.com/9f7414eb10.js" crossorigin="anonymous"></script>
    <!--Adicionando a biblioteca chart.js-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="janela">
        <!-- Navbar Lateral com Fundo de Tijolinhos -->
        <div class="header-left">
            <a href="boas_vindas.html">
                <img src="../assets/chaves_logo.png" alt="Chaves" style="width: 300px; height: auto;">
            </a>

            <div class="hello">
                <h3 style="color: #ffcc00; font-weight: 600;">Olá, <span id="b_usuario">Gerente</span></h3>
            </div>

            <div class="btn-nav">
                <a href="dashboardCopia.html" style="color: white; text-decoration: none;">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-nav">
                <a href="../selecao_quiz.html" style="color: white; text-decoration: none;">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-logout"><a href="../index.html">
                <h3>Sair</h3>
                </a>
            </div>
        </div>


<div class="conteudo-direita">
    <div class="titulo">
    <h2>Meu desempenho nos quizzes</h2>
    </div>


    <!-- Primeira parte -->
    <div class="secao-kpi">
        
        <div class="kpi">
            <h3>Total de acertos</h3>
            <p id="total_acertos">0</p>
        </div>

        <div class="kpi">
            <h3>Porcentagem geral de acertos</h3>
            <p id="percentual_acertos">0%</p>
        </div>

        <div class="kpi">
            <h3>Quizzes concluídos</h3>
            <p id="quizzes_concluidos">0</p>
        </div>
    </div>


    <div class="podio-container">

        <div class="titulo-podio">
            <p>Pódio da Vila</p>
        </div>
        <!-- 2º Lugar fica à esquerda -->
        <div class="coluna segundo">
            <div class="nome">Jogador 2</div>
            <div class="bloco">2</div>
        </div>

        <!-- 1º Lugar fica no centro -->
        <div class="coluna primeiro">
            <div class="nome">Jogador 1</div>
            <div class="bloco">1</div>
        </div>

        <!-- 3º Lugar fica à direita -->
        <div class="coluna terceiro">
            <div class="nome">Jogador 3</div>
            <div class="bloco">3</div>
        </div>
        <div class="posicao podio">
        <p>Sua posição é xx com 150 pontos</p>
        </div>
        <div class="posicao podio">

        </div>
    </div>
    <hr>
    <div class="graficos">
        <div class="graficoBar">
            <div>
                <p>Pontuação por quiz.</p>
            </div>
            <canvas id="graficoBar"></canvas>
        </div>
        </div>

    <hr>



</div>
</body>

</html>

<script>
    // Valida a sessão antes de usar a dashboard.
    // Se o usuário não estiver logado, volta para a página de login.
    validarSessao();

    // Se o navegador restaurar esta página pelo botão Voltar (cache de navegação),
    // valida a sessão novamente. Se a sessão não for válida, manda para o login.
    window.addEventListener("pageshow", function (evento) {
        if (evento.persisted) {
            validarSessao();
        }
    });

    // Script do dashboard: busca os KPIs de desempenho do usuário logado.
    function buscarDesempenho() {
        var idUsuario = obterIdUsuario();

        if (idUsuario == null) {
            return;
        }

    fetch("/quizzes/desempenho", {
            method: "GET",
            headers: {
                "x-user-id": idUsuario
            }
        }).then(function (resposta) {
            if (!resposta.ok) {
                return;
            }

            return resposta.json().then(function (dados) {
                document.getElementById("pontuacao_total").innerHTML = dados.pontuacao_total;
                document.getElementById("total_acertos").innerHTML = dados.total_de_acertos;
                document.getElementById("percentual_acertos").innerHTML = dados.percentual_geral + "%";
                document.getElementById("quizzes_concluidos").innerHTML = dados.quizzes_concluidos;
            });
        }).catch(function (erro) {
            console.log("#ERRO ao buscar o desempenho: " + erro);
        });
    }

    // Atualiza os valores das KPIs com os dados do backend.
    buscarDesempenho();

    // Formata o número com virgula decimal (ex.: 80.64 vira 80,64).
    function formatarNumero(valor) {
        return valor.toString().replace(".", ",");
    }

    // Script do dashboard: busca o ranking de usuarios com melhor desempenho nos quizzes.
    function buscarRanking() {
        var idUsuario = obterIdUsuario();

        if (idUsuario == null) {
            return;
        }

        fetch("/quizzes/ranking", {
            method: "GET",
            headers: {
                "x-user-id": idUsuario
            }
        }).then(function (resposta) {
            if (!resposta.ok) {
                return;
            }

            return resposta.json().then(function (dados) {
                renderizarPodio(dados);
            });
        }).catch(function (erro) {
            console.log("#ERRO ao buscar o ranking: " + erro);
        });
    }

    // Preenche o podio com o ranking e mostra a posicao do usuario logado.
    function renderizarPodio(ranking) {
        var lista = Array.isArray(ranking) ? ranking : [];

        // Limpa as colunas do podio antes de preencher com os novos dados.
        limparColunasDoPodio();

        // Preenche as colunas com os tres primeiros colocados do ranking.
        for (var i = 0; i < lista.length && i < 3; i++) {
            var lugar = i + 1;
            var classe = lugar == 1 ? "primeiro" : lugar == 2 ? "segundo" : "terceiro";
            var coluna = document.querySelector(".coluna." + classe);

            if (coluna == null) {
                continue;
            }

            var nome = coluna.querySelector(".nome");
            var bloco = coluna.querySelector(".bloco");

            if (lista[i] != null) {
                nome.innerHTML = lista[i].nome;
                bloco.innerHTML = formatarNumero(Number(lista[i].media_pontuacao) || 0);
            }
        }

        // Mostra a posicao do usuario logado no ranking.
        var posicaoEl = document.querySelector(".posicao.podio");
        var mensagemEl = document.querySelector(".posicao.podio p");

        if (posicaoEl != null) {
            if (lista.length == 0) {
                if (mensagemEl != null) {
                    mensagemEl.innerHTML = "O ranking ainda não possui participantes.";
                }
                return;
            }

            var idUsuarioLogado = obterIdUsuario();
            var usuarioLogado = null;
            var lugarLogado = 0;

            for (var i = 0; i < lista.length; i++) {
                if (Number(lista[i].idUsuario) == idUsuarioLogado) {
                    usuarioLogado = lista[i];
                    lugarLogado = i + 1;
                    break;
                }
            }

            if (mensagemEl != null) {
                if (usuarioLogado != null) {
                    mensagemEl.innerHTML = "Sua posição é " + lugarLogado + "º com " + formatarNumero(Number(usuarioLogado.media_pontuacao) || 0) + " pontos";
                } else {
                    mensagemEl.innerHTML = "Você não está entre os três primeiros.";
                }
            }
        }
    }

    // Limpa os nomes e as barras do podio.
    function limparColunasDoPodio() {
        var colunas = document.querySelectorAll(".podio-container .coluna");

        for (var i = 0; i < colunas.length; i++) {
            var nome = colunas[i].querySelector(".nome");
            var bloco = colunas[i].querySelector(".bloco");

            if (nome != null) {
                nome.innerHTML = "";
            }

            if (bloco != null) {
                bloco.innerHTML = "";
            }
        }
    }

    // Atualiza o ranking com os dados do backend.
    buscarRanking();

    // Script do dashboard: cria gráficos com Chart.js
    // Busca os dados de maior pontuação por quiz e desenha o gráfico
    function buscarMaiorPontuacao() {
        var idUsuario = obterIdUsuario();
        if (idUsuario == null) return;

        fetch("/quizzes/maior_pontuacao", {
            method: "GET",
            headers: { "x-user-id": idUsuario }
        }).then(function (res) {
            if (!res.ok) return;
            return res.json().then(function (dados) {
                var labels = dados.map(function (d) { return d.titulo; });
                var data = dados.map(function (d) { return Number(d.maior_pontuacao) || 0; });

                var ctx = document.getElementById("graficoBar").getContext("2d");
                new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: labels,
                        datasets: [{
                            label: "Maior pontuação por quiz",
                            data: data,
                            borderColor: "green",
                            backgroundColor: "rgba(0,128,0,0.6)"
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, max: 100 }
                        }
                    }
                });
            });
        }).catch(function (erro) {
            console.log("#ERRO ao buscar maior pontuação: " + erro);
        });
    }

    // Busca posição do usuário e atualiza o texto abaixo do pódio
    function buscarPosicaoUsuario() {
        var idUsuario = obterIdUsuario();
        if (idUsuario == null) return;

        fetch("/quizzes/posicao_usuario", {
            method: "GET",
            headers: { "x-user-id": idUsuario }
        }).then(function (res) {
            if (!res.ok) return;
            return res.json().then(function (dados) {
                var posicaoEl = document.querySelector(".posicao.podio p");
                if (posicaoEl) {
                    if (dados.posicao == null) {
                        posicaoEl.innerHTML = "Você ainda não realizou quizzes.";
                    } else {
                        posicaoEl.innerHTML = "Sua posição é " + dados.posicao + " com " + formatarNumero(Number(dados.pontuacao_total) || 0) + " pontos";
                    }
                }
            });
        }).catch(function (erro) {
            console.log("#ERRO ao buscar posição do usuário: " + erro);
        });
    }

    buscarMaiorPontuacao();
    buscarPosicaoUsuario();
    
</script>
