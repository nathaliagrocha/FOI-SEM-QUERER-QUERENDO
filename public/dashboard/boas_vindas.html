<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaves | Bem-vindo à vila</title>

    <link rel="stylesheet" href="./../css/quiz.css">
    <script src="../js/sessao.js"></script>

    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        /* Centraliza a frase de boas-vindas no espaço à direita da navbar */
        #boas_vindas {
            grid-column: 1 / -1;
            min-height: calc(100vh - 40px);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #boas_vindas h2 {
            margin: 0;
            text-align: center;
            font-family: 'Bangers', cursive;
            font-size: 4rem;
            letter-spacing: 2px;
            color: #ffcc00;
            text-shadow: 3px 3px 0 #522118, 6px 6px 14px rgba(0, 0, 0, 0.7);
        }
    </style>
</head>

<body>

    <div class="janela">
        <!-- Navbar Lateral com Fundo de Tijolinhos -->
         <div class="header-left">
            <a href="boas_vindas.html">
                <img src="../assets/chaves_logo.png" alt="Chaves" style="width: 300px; height: auto;">
            </a>

            <div class="hello">
                <h3 style="color: #ffcc00; font-weight: 600;">Olá, <span id="b_usuario">Gerente</span></h3>
            </div>

            <div class="btn-nav">
                <a href="dashboardCopia.html" style="color: white; text-decoration: none;">
                    <h3>Dashboard</h3>
                </a>
            </div>

            <div class="btn-nav">
                <a href="../quiz.html" style="color: white; text-decoration: none;">
                    <h3>Quiz</h3>
                </a>
            </div>

            <div class="btn-logout" onclick="limparSessao()"><a href="../login.html">
                <h3>Sair</h3>
                </a>
            </div>
        </div>

        <!-- Área com a imagem de fundo da vila e a mensagem centralizada -->
        <div class="conteudo-direita">
            <div id="boas_vindas">
                <h2>Bem-vindo à vila!</h2>
            </div>
        </div>
    </div>

    <script>
        // Protege a tela: sem sessão válida, validarSessao() manda para o login.
        validarSessao();

        // Se a página voltar pelo botão "Voltar" do navegador, valida de novo.
        window.addEventListener("pageshow", function (evento) {
            if (evento.persisted) {
                validarSessao();
            }
        });
    </script>
</body>

</html>
