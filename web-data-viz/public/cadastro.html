<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Chaves - Cadastro</title>

  <!-- Importando fontes e estilos do projeto -->
  <link rel="stylesheet" href="./css/cadastro.css" />
  <link rel="preconnect" href="https://fonts.gstatic.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
  <!-- Ícone para a setinha de voltar -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

  <!-- Botão de Voltar (Setinha no topo esquerdo) -->
  <a href="home.html" class="botao-voltar" title="Voltar para a página inicial">
    <i class="fa-solid fa-arrow-left"></i>
  </a>

  <!-- Container Principal com o Fundo Fixo do Banner -->
  <div class="container-cadastro-principal">
    
    <!-- Caixa Transparente Aumentada -->
    <div class="card-cadastro-container">

      <!-- Lado Esquerdo: Formulário de Cadastro -->
      <div class="lado-formulario">
        <h2>Faça seu Cadastro</h2>
        
        <div class="formulario">
          <div class="campo">
            <span>Nome:</span>
            <input id="nome_input" type="text" placeholder="Seu nome completo" />
          </div>

          <div class="campo">
            <span>E-mail:</span>
            <input id="email_input" type="text" placeholder="meuemail@provedor.com" />
          </div>

          <div class="campo">
            <span>Senha:</span>
            <input id="senha_input" type="password" placeholder="******" />
          </div>

          <div class="campo">
            <span>Confirmação da Senha:</span>
            <input id="confirmacao_senha_input" type="password" placeholder="******" />
          </div>

          <button class="botao-cadastrar" onclick="cadastrar()">Cadastrar</button>
        </div>
      </div>

      <!-- Lado Direito: Degradê e Chapéu do Chaves -->
      <div class="lado-degrade-info">
        <div class="conteudo-direito">
          <div class="container-imagem-chapu">
            <img src="assets/chaves_chapeu.png" alt="Chapéu do Chaves" class="img-chapu-ilustracao">
          </div>
          <h3>"Isso, isso, isso!"</h3>
          <p class="frase-convite">Já tem uma conta? Acesse por aqui e volte para a vila!</p>
          <a href="login.html" class="botao-ir-login">Fazer Login</a>
        </div>
      </div>

    </div>
  </div>

</body>
</html>

<SCRipt>
function cadastrar() {
    // Recupere o valor dos inputs do seu HTML
    var nomeVar = input_nome.value;
    var emailVar = input_email.value;
    var senhaVar = input_senha.value;

    // Envio dos dados para a rota da API
    fetch("/usuarios/cadastrar", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
        },
        body: JSON.stringify({
            // As chaves devem ter o mesmo nome que o backend espera receber
            nomeServer: nomeVar,
            emailServer: emailVar,
            senhaServer: senhaVar
        }),
    }).then(function (resposta) {
        if (resposta.ok) {
            window.alert("Cadastro realizado com sucesso!");
            window.location = "login.html"; // Redireciona para o login
        } else {
            window.alert("Houve um erro no tentar realizar o cadastro!");
        }
    }).catch(function (erro) {
        console.log(`#ERRO: ${erro}`);
    });

    return false;
}
</SCRipt>
