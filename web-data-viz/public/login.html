<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Chaves - Login</title>

    <script src="./js/sessao.js"></script>

    <!-- Importando fontes e estilos -->
    <link rel="stylesheet" href="./css/login.css">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <!-- Ícone para a setinha de voltar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>

    <!-- Botão de Voltar (Setinha no topo esquerdo) -->
    <a href="index.html" class="botao-voltar" title="Voltar para a página inicial">
        <i class="fa-solid fa-arrow-left"></i>
    </a>

    <!-- Container Principal com o Fundo Fixo do Banner -->
    <div class="container-login-principal">
        
        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>

        <!-- Caixa Transparente idêntica à de cadastro -->
        <div class="card-login-container">

            <!-- Lado Esquerdo: Degradê, Chapéu e Link para Cadastro -->
            <div class="lado-degrade-info">
                <div class="conteudo-direito">
                    <div class="container-imagem-chapu">
                        <img src="assets/chaves_barril.jpg" alt="Chapéu do Chaves" class="img-chapu-ilustracao">
                    </div>
                    <h3>"ISSO, ISSO, ISSO!"</h3>
                    <p class="frase-convite">Ainda não faz parte da nossa vizinhança? Cadastre-se já!</p>
                    <a href="cadastro.html" class="botao-ir-cadastro">Criar Conta</a>
                </div>
            </div>

            <!-- Lado Direito: Formulário de Login (Apenas E-mail e Senha) -->
            <div class="lado-formulario">
                <h2>Olá de volta!</h2>
                
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail:</span>
                        <input id="email_input" type="text" placeholder="meuemail@provedor.com">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao-entrar" onclick="entrar()">Entrar</button>
                </div>

                <div id="div_erros_login"></div>
            </div>

        </div>
    </div>

</body>

</html>

<script>
    function entrar() {
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }

        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;
                    sessionStorage.AQUARIOS = JSON.stringify(json.aquarios)

                    setTimeout(function () {
                        window.location = "./dashboard/cards.html";
                    }, 1000);

                });

            } else {
                console.log("Houve um erro ao tentar realizar o login!");
                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }
</script>
